<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon Espace</title>
<script src="https://res.cdn.office.net/teams-js/2.22.0/js/MicrosoftTeams.min.js" crossorigin="anonymous"></script>
<style>
  :root { --bg:#f5f5f5; --card:#fff; --text:#242424; --muted:#616161; --accent:#5b5fc7; --border:#e0e0e0; }
  body.dark { --bg:#1f1f1f; --card:#292929; --text:#ffffff; --muted:#adadad; --accent:#7f85f5; --border:#3d3d3d; }
  body.contrast { --bg:#000; --card:#000; --text:#fff; --muted:#fff; --accent:#ffff00; --border:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 24px 8px; }
  h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:14px; }
  form { display:flex; gap:8px; padding:12px 24px; }
  input { flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:4px; background:var(--card); color:var(--text); font:inherit; }
  button { padding:8px 14px; border:0; border-radius:4px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  body.contrast button { color:#000; }
  .board { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; padding:12px 24px 24px; }
  .col { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px; min-height:160px; }
  .col h2 { font-size:14px; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .task { border:1px solid var(--border); border-radius:6px; padding:8px 10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .task span { word-break:break-word; }
  .task .actions button { padding:2px 8px; font-size:12px; margin-left:4px; background:transparent; color:var(--accent); border:1px solid var(--border); }
  footer { padding:0 24px 24px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1 id="greeting">Bonjour 👋</h1>
  <p>Votre tableau de tâches personnel. Les données restent dans ce navigateur.</p>
</header>
<form id="add">
  <input id="title" placeholder="Nouvelle tâche…" autocomplete="off" required>
  <button type="submit">Ajouter</button>
</form>
<main class="board">
  <section class="col" data-col="todo"><h2>À faire</h2><div></div></section>
  <section class="col" data-col="doing"><h2>En cours</h2><div></div></section>
  <section class="col" data-col="done"><h2>Terminé</h2><div></div></section>
</main>
<footer id="confidentialite">Confidentialité : aucune donnée n'est envoyée à un serveur. <span id="conditions">Conditions : application fournie telle quelle.</span></footer>
<script>
  const KEY = "monespace.tasks";
  const order = ["todo", "doing", "done"];
  let tasks = [];
  try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} };

  function render() {
    for (const col of order) {
      const box = document.querySelector(`[data-col="${col}"] div`);
      box.innerHTML = "";
      tasks.filter(t => t.col === col).forEach(t => {
        const el = document.createElement("div");
        el.className = "task";
        const label = document.createElement("span");
        label.textContent = t.title;
        const actions = document.createElement("div");
        actions.className = "actions";
        const i = order.indexOf(col);
        if (i > 0) actions.append(btn("←", () => move(t, -1)));
        if (i < order.length - 1) actions.append(btn("→", () => move(t, 1)));
        actions.append(btn("✕", () => { tasks = tasks.filter(x => x !== t); save(); render(); }));
        el.append(label, actions);
        box.append(el);
      });
    }
  }
  function btn(txt, fn) { const b = document.createElement("button"); b.type = "button"; b.textContent = txt; b.onclick = fn; return b; }
  function move(t, d) { t.col = order[order.indexOf(t.col) + d]; save(); render(); }

  document.getElementById("add").addEventListener("submit", e => {
    e.preventDefault();
    const input = document.getElementById("title");
    tasks.push({ title: input.value.trim(), col: "todo" });
    input.value = "";
    save(); render();
  });
  render();

  // Intégration Teams (thème + prénom) — ignorée si la page est ouverte hors de Teams
  const applyTheme = th => { document.body.className = th === "dark" ? "dark" : th === "contrast" ? "contrast" : ""; };
  if (window.microsoftTeams && new URLSearchParams(location.search).has("inTeams")) {
    microsoftTeams.app.initialize().then(() => microsoftTeams.app.getContext()).then(ctx => {
      applyTheme(ctx.app.theme);
      microsoftTeams.app.registerOnThemeChangeHandler(applyTheme);
      const name = ctx.user && ctx.user.displayName;
      if (name) document.getElementById("greeting").textContent = `Bonjour ${name.split(" ")[0]} 👋`;
    }).catch(() => {});
  }
</script>
</body>
</html>
