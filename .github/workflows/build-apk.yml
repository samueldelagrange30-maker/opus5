name: Construire l'APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Calculatrice.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Calculatrice-apk
          path: Calculatrice.apk

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: calculatrice-v1.0-build${{ github.run_number }}
          name: Calculatrice v1.0 (build ${{ github.run_number }})
          body: APK de la calculatrice. Téléchargez Calculatrice.apk sur votre téléphone Android pour l'installer.
          files: Calculatrice.apk
