plugins {
    id 'com.android.application'
}

android {
    namespace 'com.samuel.calculatrice'
    compileSdk 35

    defaultConfig {
        applicationId 'com.samuel.calculatrice'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signé avec la clé de debug pour pouvoir être installé directement
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
