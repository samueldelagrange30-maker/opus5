<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convoy3D — Conception et simulation de convoyage</title>
  <meta name="description" content="Logiciel web de conception et de simulation de systèmes de convoyage industriel en 3D.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='8' width='22' height='7' rx='1.5' fill='%2300b4d8'/%3E%3Ccircle cx='6' cy='11.5' r='1.6' fill='%23fff'/%3E%3Ccircle cx='12' cy='11.5' r='1.6' fill='%23fff'/%3E%3Ccircle cx='18' cy='11.5' r='1.6' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24"><rect x="1" y="8" width="22" height="7" rx="1.5" fill="#00b4d8"/><circle cx="6" cy="11.5" r="1.6" fill="#fff"/><circle cx="12" cy="11.5" r="1.6" fill="#fff"/><circle cx="18" cy="11.5" r="1.6" fill="#fff"/><path d="M4 15v6M20 15v6" stroke="#7f93ad" stroke-width="2"/></svg>
        <span>Convoy<b>3D</b></span>
      </div>
      <nav id="menubar"></nav>
      <div id="projectName" class="project-name"></div>
    </header>
    <div id="toolbar"></div>
    <main id="workspace">
      <aside id="left" class="panel"></aside>
      <section id="center">
        <div id="viewport"></div>
        <div id="viewbar"></div>
      </section>
      <aside id="right" class="panel"></aside>
    </main>
    <footer id="simbar"></footer>
  </div>
  <div id="modal-root"></div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>

  <!-- Bibliothèque 3D (locale, aucune connexion requise) -->
  <script src="vendor/three.min.js"></script>
  <!-- Cœur -->
  <script src="js/core/util.js"></script>
  <script src="js/core/path.js"></script>
  <!-- Modèle -->
  <script src="js/model/formats.js"></script>
  <script src="js/model/types.js"></script>
  <script src="js/model/walls.js"></script>
  <script src="js/model/network.js"></script>
  <script src="js/model/project.js"></script>
  <script src="js/model/analysis.js"></script>
  <!-- Vue 3D -->
  <script src="js/view/geometry.js"></script>
  <script src="js/view/viewport.js"></script>
  <!-- Simulation -->
  <script src="js/sim/simulation.js"></script>
  <script src="js/view/director.js"></script>
  <script src="js/sim/planner.js"></script>
  <script src="js/sim/forklift.js"></script>
  <!-- Entrées / sorties -->
  <script src="js/io/io.js"></script>
  <!-- Interface -->
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
