Screens:
  scrListe:
    Properties:
      Fill: =RGBA(243, 245, 248, 1)
    Children:
      - recEnteteListe:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(0, 95, 184, 1)
            Width: =Parent.Width
            Height: =80
      - lblTitreListe:
          Control: Label@2.5.1
          Properties:
            Text: ="Gestion des tickets"
            Color: =RGBA(255, 255, 255, 1)
            Size: =22
            FontWeight: =FontWeight.Bold
            X: =24
            Y: =0
            Width: =Parent.Width - 300
            Height: =80
      - btnNouveauTicket:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="+ Nouveau ticket"
            OnSelect: =Navigate(scrNouveau, ScreenTransition.Cover)
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(0, 95, 184, 1)
            HoverFill: =RGBA(230, 240, 250, 1)
            HoverColor: =RGBA(0, 95, 184, 1)
            BorderThickness: =0
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            FontWeight: =FontWeight.Semibold
            X: =Parent.Width - Self.Width - 24
            Y: =18
            Width: =220
            Height: =44
      - txtRecherche:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            HintText: ="Rechercher par titre..."
            X: =24
            Y: =100
            Width: =(Parent.Width - 72) * 0.65
            Height: =44
      - ddFiltreStatut:
          Control: Classic/DropDown@2.3.1
          Properties:
            Items: =["Tous", "Ouvert", "Clôturé"]
            Default: ="Ouvert"
            X: =txtRecherche.X + txtRecherche.Width + 24
            Y: =100
            Width: =(Parent.Width - 72) * 0.35
            Height: =44
      - galTickets:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: |-
              =SortByColumns(
                  Filter(
                      Tickets,
                      (ddFiltreStatut.Selected.Value = "Tous" || Statut = ddFiltreStatut.Selected.Value) &&
                      (IsBlank(txtRecherche.Text) || StartsWith(Title, txtRecherche.Text))
                  ),
                  "ID",
                  SortOrder.Descending
              )
            OnSelect: |-
              =Set(varTicket, ThisItem);
              Navigate(scrDetail, ScreenTransition.Cover)
            TemplateSize: =96
            TemplatePadding: =6
            X: =24
            Y: =164
            Width: =Parent.Width - 48
            Height: =Parent.Height - Self.Y - 24
          Children:
            - recCarte:
                Control: Rectangle@2.3.0
                Properties:
                  OnSelect: =Select(Parent)
                  Fill: =RGBA(255, 255, 255, 1)
                  BorderColor: =RGBA(220, 224, 230, 1)
                  BorderThickness: =1
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
            - lblNumero:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: ="TCK-" & Text(ThisItem.ID, "0000")
                  Color: =RGBA(100, 110, 120, 1)
                  Size: =11
                  X: =16
                  Y: =8
                  Width: =120
                  Height: =26
            - lblTitreTicket:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.Title
                  FontWeight: =FontWeight.Semibold
                  Size: =15
                  X: =16
                  Y: =32
                  Width: =Parent.TemplateWidth - 300
                  Height: =30
            - lblInfosTicket:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.Categorie & "  •  " & ThisItem.Demandeur & "  •  " & Text(ThisItem.Created, "dd/mm/yyyy hh:mm")
                  Color: =RGBA(100, 110, 120, 1)
                  Size: =11
                  X: =16
                  Y: =60
                  Width: =Parent.TemplateWidth - 300
                  Height: =26
            - lblPriorite:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.Priorite
                  Align: =Align.Center
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: |-
                    =Switch(
                        ThisItem.Priorite,
                        "Critique", RGBA(196, 43, 28, 1),
                        "Haute", RGBA(218, 110, 0, 1),
                        "Moyenne", RGBA(0, 95, 184, 1),
                        RGBA(120, 130, 140, 1)
                    )
                  X: =Parent.TemplateWidth - 270
                  Y: =30
                  Width: =110
                  Height: =32
            - lblStatut:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.Statut
                  Align: =Align.Center
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Color: =If(ThisItem.Statut = "Clôturé", RGBA(80, 90, 100, 1), RGBA(16, 124, 16, 1))
                  Fill: =If(ThisItem.Statut = "Clôturé", RGBA(225, 228, 232, 1), RGBA(223, 246, 221, 1))
                  X: =Parent.TemplateWidth - 145
                  Y: =30
                  Width: =110
                  Height: =32
      - lblAucunTicket:
          Control: Label@2.5.1
          Properties:
            Text: ="Aucun ticket à afficher."
            Visible: =IsEmpty(galTickets.AllItems)
            Align: =Align.Center
            Color: =RGBA(100, 110, 120, 1)
            X: =24
            Y: =220
            Width: =Parent.Width - 48
            Height: =40
