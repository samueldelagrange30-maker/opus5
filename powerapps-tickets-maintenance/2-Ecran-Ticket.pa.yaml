Screens:
  scrTicket:
    Properties:
      Fill: =RGBA(241, 245, 249, 1)
      OnVisible: |-
        =Reset(txtTitre);
        Reset(txtEquipement);
        Reset(txtLieu);
        Reset(txtDescription);
        Reset(txtIntervention);
        Reset(drpDomaine);
        Reset(drpUrgenceT);
        Reset(drpStatutT);
        Reset(cmbTechnicien);
        Reset(dteLimite)
    Children:
      - recEnteteT:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =80
            Fill: =RGBA(15, 23, 42, 1)
      - icoRetour:
          Control: Classic/Icon
          Properties:
            X: =24
            Y: =22
            Width: =36
            Height: =36
            Icon: =Icon.ChevronLeft
            Color: =RGBA(255, 255, 255, 1)
            OnSelect: =Navigate(scrAccueil, ScreenTransition.UnCover)
      - lblTitreEcran:
          Control: Label
          Properties:
            X: =76
            Y: =8
            Width: =700
            Height: =40
            Text: |-
              =If(varNouveau, "Nouveau ticket", "Ticket #" & varTicket.ID)
            Color: =RGBA(255, 255, 255, 1)
            Size: =20
            FontWeight: =FontWeight.Bold
      - lblSousTitreEcran:
          Control: Label
          Properties:
            X: =76
            Y: =44
            Width: =Parent.Width - 108
            Height: =28
            Text: |-
              =If(
                  varNouveau,
                  "Décrivez le problème : le ticket sera créé avec le statut « Ouvert ».",
                  "Créé le " & Text(varTicket.Created, "dd/mm/yyyy") & " par " & varTicket.Author.DisplayName &
                  "  ·  Modifié le " & Text(varTicket.Modified, "dd/mm/yyyy hh:mm") &
                  If(IsBlank(varTicket.DateCloture), "", "  ·  Clôturé le " & Text(varTicket.DateCloture, "dd/mm/yyyy"))
              )
            Color: =RGBA(203, 213, 225, 1)
            Size: =11
      - recCarteForm:
          Control: Rectangle
          Properties:
            X: =32
            Y: =96
            Width: =Parent.Width - 64
            Height: =560
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(226, 232, 240, 1)
            BorderThickness: =1
      - lblTitreChamp:
          Control: Label
          Properties:
            X: =56
            Y: =112
            Width: =(Parent.Width - 136) / 2
            Height: =26
            Text: ="Titre *"
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(51, 65, 85, 1)
      - txtTitre:
          Control: Classic/TextInput
          Properties:
            X: =56
            Y: =138
            Width: =(Parent.Width - 136) / 2
            Height: =40
            Default: =If(varNouveau, "", varTicket.Title)
            HintText: |-
              ="Ex. : Fuite d'huile presse P2"
            Size: =12
      - lblEquipementChamp:
          Control: Label
          Properties:
            X: =56
            Y: =192
            Width: =(Parent.Width - 136) / 2
            Height: =26
            Text: ="Équipement *"
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(51, 65, 85, 1)
      - txtEquipement:
          Control: Classic/TextInput
          Properties:
            X: =56
            Y: =218
            Width: =(Parent.Width - 136) / 2
            Height: =40
            Default: =If(varNouveau, "", varTicket.Equipement)
            HintText: ="Machine, installation, pièce…"
            Size: =12
      - lblLieuChamp:
          Control: Label
          Properties:
            X: =56
            Y: =272
            Width: =(Parent.Width - 136) / 2
            Height: =26
            Text: ="Lieu"
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(51, 65, 85, 1)
      - txtLieu:
          Control: Classic/TextInput
          Properties:
            X: =56
            Y: =298
            Width: =(Parent.Width - 136) / 2
            Height: =40
            Default: =If(varNouveau, "", varTicket.Lieu)
            HintText: ="Bâtiment, atelier, étage…"
            Size: =12
      - lblDescriptionChamp:
          Control: Label
          Properties:
            X: =56
            Y: =352
            Width: =(Parent.Width - 136) / 2
            Height: =26
            Text: ="Description du problème"
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(51, 65, 85, 1)
      - txtDescription:
          Control: Classic/TextInput
          Properties:
            X: =56
            Y: =378
            Width: =(Parent.Width - 136) / 2
            Height: =120
            Mode: =TextMode.MultiLine
            Default: =If(varNouveau, "", varTicket.Description)
            Size: =12
      - lblInterventionChamp:
          Control: Label
          Properties:
            X: =56
            Y: =512
            Width: =(Parent.Width - 136) / 2
            Height: =26
            Text: ="Intervention réalisée / commentaire"
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(51, 65, 85, 1)
      - txtIntervention:
          Control: Classic/TextInput
          Properties:
            X: =56
            Y: =538
            Width: =(Parent.Width - 136) / 2
            Height: =100
            Mode: =TextMode.MultiLine
            Default: =If(varNouveau, "", varTicket.Intervention)
            Size: =12
      - lblDomaineChamp:
          Control: Label
          Properties:
            X: =80 + (Parent.Width - 136) / 2
            Y: =112
            Width: =(Parent.Width - 136) / 2
            Height: =26
            Text: ="Domaine"
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(51, 65, 85, 1)
      - drpDomaine:
          Control: Classic/DropDown
          Properties:
            X: =80 + (Parent.Width - 136) / 2
            Y: =138
            Width: =(Parent.Width - 136) / 2
            Height: =40
            Items: =Choices(TicketsMaintenance.Domaine)
            Default: =If(varNouveau, "Mécanique", varTicket.Domaine.Value)
            Size: =12
      - lblUrgenceChamp:
          Control: Label
          Properties:
            X: =80 + (Parent.Width - 136) / 2
            Y: =192
            Width: =(Parent.Width - 136) / 2
            Height: =26
            Text: ="Urgence"
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(51, 65, 85, 1)
      - drpUrgenceT:
          Control: Classic/DropDown
          Properties:
            X: =80 + (Parent.Width - 136) / 2
            Y: =218
            Width: =(Parent.Width - 136) / 2
            Height: =40
            Items: =Choices(TicketsMaintenance.Urgence)
            Default: =If(varNouveau, "Moyenne", varTicket.Urgence.Value)
            Size: =12
      - lblStatutChamp:
          Control: Label
          Properties:
            X: =80 + (Parent.Width - 136) / 2
            Y: =272
            Width: =(Parent.Width - 136) / 2
            Height: =26
            Text: ="Statut"
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(51, 65, 85, 1)
      - drpStatutT:
          Control: Classic/DropDown
          Properties:
            X: =80 + (Parent.Width - 136) / 2
            Y: =298
            Width: =(Parent.Width - 136) / 2
            Height: =40
            Items: =Choices(TicketsMaintenance.Statut)
            Default: =If(varNouveau, "Ouvert", varTicket.Statut.Value)
            DisplayMode: =If(varNouveau, DisplayMode.Disabled, DisplayMode.Edit)
            Size: =12
      - lblDemandeurChamp:
          Control: Label
          Properties:
            X: =80 + (Parent.Width - 136) / 2
            Y: =352
            Width: =(Parent.Width - 136) / 2
            Height: =26
            Text: ="Demandeur"
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(51, 65, 85, 1)
      - lblDemandeur:
          Control: Label
          Properties:
            X: =80 + (Parent.Width - 136) / 2
            Y: =378
            Width: =(Parent.Width - 136) / 2
            Height: =40
            Text: =If(varNouveau, User().FullName, varTicket.Author.DisplayName)
            Fill: =RGBA(248, 250, 252, 1)
            BorderColor: =RGBA(203, 213, 225, 1)
            BorderThickness: =1
            PaddingLeft: =12
            Color: =RGBA(71, 85, 105, 1)
            Size: =12
      - lblTechnicienChamp:
          Control: Label
          Properties:
            X: =80 + (Parent.Width - 136) / 2
            Y: =432
            Width: =(Parent.Width - 136) / 2 - 170
            Height: =26
            Text: ="Technicien assigné"
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(51, 65, 85, 1)
      - cmbTechnicien:
          Control: Classic/ComboBox
          Properties:
            X: =80 + (Parent.Width - 136) / 2
            Y: =458
            Width: =(Parent.Width - 136) / 2 - 170
            Height: =40
            Items: =Choices(TicketsMaintenance.Technicien)
            DefaultSelectedItems: =If(varNouveau, Blank(), varTicket.Technicien)
            SelectMultiple: =false
            IsSearchable: =true
            SearchFields: =["DisplayName"]
            DisplayFields: =["DisplayName"]
            InputTextPlaceholder: ="Rechercher une personne…"
      - btnPrendreEnCharge:
          Control: Classic/Button
          Properties:
            X: =80 + (Parent.Width - 136) - 160
            Y: =458
            Width: =160
            Height: =40
            Text: ="Je prends en charge"
            Size: =11
            Fill: =RGBA(147, 51, 234, 1)
            HoverFill: =RGBA(126, 34, 206, 1)
            Color: =RGBA(255, 255, 255, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            Visible: =!varNouveau && varTicket.Statut.Value <> "Résolu" && varTicket.Statut.Value <> "Clôturé"
            OnSelect: |-
              =Set(
                  varTicket,
                  Patch(
                      TicketsMaintenance,
                      LookUp(TicketsMaintenance, ID = varTicket.ID),
                      {
                          Technicien: {
                              Claims: "i:0#.f|membership|" & Lower(User().Email),
                              DisplayName: User().FullName,
                              Email: User().Email,
                              Department: "",
                              JobTitle: "",
                              Picture: ""
                          },
                          Statut: {Value: "En cours"}
                      }
                  )
              );
              Reset(cmbTechnicien);
              Reset(drpStatutT);
              Notify("Ticket pris en charge par " & User().FullName, NotificationType.Success)
      - lblLimiteChamp:
          Control: Label
          Properties:
            X: =80 + (Parent.Width - 136) / 2
            Y: =512
            Width: =(Parent.Width - 136) / 2
            Height: =26
            Text: ="Date limite d'intervention"
            Size: =11
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(51, 65, 85, 1)
      - dteLimite:
          Control: Classic/DatePicker
          Properties:
            X: =80 + (Parent.Width - 136) / 2
            Y: =538
            Width: =(Parent.Width - 136) / 2
            Height: =40
            DefaultDate: |-
              =If(
                  varNouveau,
                  DateAdd(Today(), 7, TimeUnit.Days),
                  varTicket.DateLimite
              )
            Format: =DateTimeFormat.ShortDate
            Size: =12
      - btnAnnuler:
          Control: Classic/Button
          Properties:
            X: =Parent.Width - 452
            Y: =676
            Width: =200
            Height: =48
            Text: ="Annuler"
            Fill: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(241, 245, 249, 1)
            Color: =RGBA(51, 65, 85, 1)
            BorderColor: =RGBA(203, 213, 225, 1)
            BorderThickness: =1
            Size: =13
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            OnSelect: =Navigate(scrAccueil, ScreenTransition.UnCover)
      - btnEnregistrer:
          Control: Classic/Button
          Properties:
            X: =Parent.Width - 232
            Y: =676
            Width: =200
            Height: =48
            Text: =If(varNouveau, "Créer le ticket", "Enregistrer")
            Fill: =RGBA(37, 99, 235, 1)
            HoverFill: =RGBA(29, 78, 216, 1)
            Color: =RGBA(255, 255, 255, 1)
            Size: =13
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            OnSelect: |-
              =If(
                  IsBlank(Trim(txtTitre.Text)) || IsBlank(Trim(txtEquipement.Text)),
                  Notify("Le titre et l'équipement sont obligatoires.", NotificationType.Error),
                  Patch(
                      TicketsMaintenance,
                      If(varNouveau, Defaults(TicketsMaintenance), LookUp(TicketsMaintenance, ID = varTicket.ID)),
                      {
                          Title: Trim(txtTitre.Text),
                          Description: txtDescription.Text,
                          Equipement: Trim(txtEquipement.Text),
                          Lieu: Trim(txtLieu.Text),
                          Domaine: drpDomaine.Selected,
                          Urgence: drpUrgenceT.Selected,
                          Statut: drpStatutT.Selected,
                          Technicien: cmbTechnicien.Selected,
                          DateLimite: dteLimite.SelectedDate,
                          Intervention: txtIntervention.Text,
                          DateCloture: If(
                              drpStatutT.Selected.Value = "Résolu" || drpStatutT.Selected.Value = "Clôturé",
                              Coalesce(varTicket.DateCloture, Today()),
                              Blank()
                          )
                      }
                  );
                  If(
                      IsEmpty(Errors(TicketsMaintenance)),
                      Notify("Ticket enregistré avec succès.", NotificationType.Success);
                      Navigate(scrAccueil, ScreenTransition.UnCover),
                      Notify("Erreur : " & First(Errors(TicketsMaintenance)).Message, NotificationType.Error)
                  )
              )
